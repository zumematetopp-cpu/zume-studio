name: Add ZUME Project Pages

on:
  workflow_run:
    workflows: ["Deploy ZUME Studio"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-projects:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download published Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: _artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Add project folders
        run: |
          rm -rf _site
          mkdir -p _site
          tar -xf _artifact/artifact.tar -C _site

          if [ -d projects ]; then
            for project_dir in projects/*; do
              [ -d "$project_dir" ] || continue
              project_name=$(basename "$project_dir")
              mkdir -p "_site/$project_name"
              cp -R "$project_dir"/. "_site/$project_name"/
            done
          fi

          if [ -d checklist-ochoas ]; then
            mkdir -p _site/checklist-ochoas
            cp -R checklist-ochoas/. _site/checklist-ochoas/
          fi

          if [ -d planificador ]; then
            mkdir -p _site/planificador
            cp -R planificador/. _site/planificador/
          fi

          echo 'zumestudio.com' > _site/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload updated Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy updated Pages site
        id: deployment
        uses: actions/deploy-pages@v4
