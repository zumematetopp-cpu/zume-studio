name: Snapshot Canva previews
on:
  push:
    branches: [main]
    paths:
      - 'planificador/canva-snapshot-urls.txt'
      - '.github/workflows/snapshot-canva.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Canva previews into the site
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r path url; do
            [ -z "$path" ] && continue
            mkdir -p "$(dirname "$path")"
            echo "Downloading $path"
            if ! curl -L --fail --retry 2 --retry-delay 1 "$url" -o "$path"; then
              fallback=$(python - "$url" <<'PY'
import sys, urllib.parse
u=sys.argv[1]
q=urllib.parse.parse_qs(urllib.parse.urlparse(u).query)
print(q.get('fallback',[''])[0])
PY
)
              if [ -z "$fallback" ]; then
                echo "No fallback URL for $path"
                exit 1
              fi
              echo "Using Canva fallback for $path"
              curl -L --fail --retry 3 --retry-delay 2 "$fallback" -o "$path"
            fi
          done < planificador/canva-snapshot-urls.txt
      - name: Commit stable preview files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add planificador/assets/ochoas/canva
          if git diff --cached --quiet; then
            echo "No asset changes"
            exit 0
          fi
          git commit -m "Store stable Ochoas Canva previews"
          git push
