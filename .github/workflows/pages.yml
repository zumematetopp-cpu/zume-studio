name: Deploy ZUME Studio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare site
        run: |
          rm -rf _site
          mkdir _site
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'site*.zip' | head -n 1)
          test -n "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d _site

          BRANDKIT_FILE=$(find . -maxdepth 1 -type f -iname '*Ttintico*Brand*Kit*.html' | head -n 1)
          if [ -n "$BRANDKIT_FILE" ]; then
            mkdir -p _site/ttintico-brand-kit
            cp "$BRANDKIT_FILE" _site/ttintico-brand-kit/index.html
          fi

          CAMPAIGN_FILE=$(find . -maxdepth 1 -type f \( -iname '*Ttintico*Valledupar*Cultura*Cafetera*.html' -o -iname '*Ttintico*Campana*Valledupar*.html' \) | head -n 1)
          if [ -n "$CAMPAIGN_FILE" ]; then
            mkdir -p _site/ttintico-campana-valledupar
            cp "$CAMPAIGN_FILE" _site/ttintico-campana-valledupar/index.html
          fi

          echo 'zumestudio.com' > _site/CNAME

          python - <<'PY'
          from pathlib import Path

          favicon = r'''<link id="zume-global-favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='10'%20fill='%23111111'/%3E%3Cpath%20d='M17%2018H47L19%2046H47'%20fill='none'%20stroke='%23ffffff'%20stroke-width='6'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3C/svg%3E">'''

          responsive = r'''<style id="zume-global-responsive-v2">
          body{font-size:16px;line-height:1.55}
          .subtitle{font-size:clamp(16px,2vw,20px);line-height:1.55}
          .card p,.card li,.panel li,.icon-item span{font-size:clamp(14px,1.25vw,16px);line-height:1.55}

          @media (max-width:1024px){
            .shell{max-width:100%;padding-left:22px;padding-right:22px}
            .brief-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
            .style-grid{grid-template-columns:1fr}
            .products{grid-template-columns:repeat(3,minmax(0,1fr))}
            .palette{grid-template-columns:repeat(5,minmax(0,1fr))}
            .mb-grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important;grid-template-rows:none !important;grid-auto-rows:clamp(180px,25vw,260px) !important;gap:10px !important}
            .mb-grid > *{grid-column:auto !important;grid-row:auto !important}
            .mb-message{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
          }

          @media (max-width:820px){
            .shell{padding-left:16px !important;padding-right:16px !important;padding-bottom:82px !important}
            .topbar{display:flex !important;align-items:center !important;justify-content:space-between !important;gap:8px !important;flex-wrap:nowrap !important;height:auto !important;min-height:0 !important;overflow:visible !important;margin-left:-16px !important;margin-right:-16px !important;padding:11px 16px !important}
            .brand{flex:1 1 auto !important;min-width:0 !important;font-size:20px !important;white-space:nowrap !important}
            .lang-toggle{flex:0 0 auto !important;margin-left:auto !important;display:flex !important;gap:5px !important}
            .lang-toggle button,.pdf-btn{min-width:40px !important;padding:8px 8px !important;font-size:11px !important}
            .topbar .client-label{display:none !important}
            .client-label.zume-mobile-client-label{display:block !important;visibility:visible !important;opacity:1 !important;position:static !important;width:auto !important;max-width:100% !important;margin:18px 0 4px !important;padding:0 !important;text-align:left !important;white-space:normal !important;line-height:1.35 !important;font-size:11px !important;letter-spacing:.08em !important;text-transform:uppercase !important;color:#666 !important;transform:none !important}
            .hero{padding-top:34px !important;padding-bottom:26px !important}
            .client-brand-row{display:flex !important;flex-direction:column !important;align-items:flex-start !important;gap:10px !important;width:100% !important;margin:12px 0 18px !important}
            .client-logo{font-size:clamp(22px,7vw,30px) !important;letter-spacing:.26em !important;white-space:normal !important;text-align:left !important}
            .client-campaign-chip{font-size:12px !important;line-height:1.3 !important;text-align:left !important}
            h1{font-size:clamp(38px,11vw,56px) !important;line-height:1.02 !important}
            .subtitle{font-size:17px !important;line-height:1.55 !important}
            .brief-grid,.style-grid{grid-template-columns:1fr !important}
            .card,.panel,.msg{padding:18px !important}
            .card p,.card li,.panel li,.icon-item span{font-size:15px !important;line-height:1.58 !important}
            .mb-head{grid-template-columns:1fr !important;gap:10px !important}
            .mb-grid{display:grid !important;grid-template-columns:repeat(2,minmax(0,1fr)) !important;grid-template-rows:none !important;grid-auto-flow:row !important;grid-auto-rows:clamp(150px,43vw,210px) !important;gap:8px !important}
            .mb-grid > *,.mb-grid .a,.mb-grid .b,.mb-grid .c,.mb-grid .d,.mb-grid .e,.mb-grid .f,.mb-grid .g,.mb-grid .h,.mb-grid .i,.mb-grid .j{grid-column:auto !important;grid-row:auto !important;width:100% !important;min-width:0 !important;height:auto !important}
            .mb-img img{width:100% !important;height:100% !important;object-fit:cover !important}
            .mb-message{grid-template-columns:1fr !important;gap:8px !important}
            .products{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
            .palette,.palette-labels{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
            .room{height:auto !important;aspect-ratio:16/10 !important}
            .footer{overflow-x:auto !important;white-space:nowrap !important;justify-content:flex-start !important}
          }

          @media (max-width:520px){
            .mb-grid{grid-template-columns:1fr !important;grid-auto-rows:auto !important}
            .mb-img{aspect-ratio:4/3 !important;min-height:0 !important}
            .products{grid-template-columns:1fr 1fr !important}
          }
          </style>'''

          letter_large = r'''<style id="zume-letter-large-print-v3">
          @media print{
            @page{size:Letter;margin:14mm 14mm 16mm 14mm !important}
            html,body{margin:0 !important;padding:0 !important;background:#fff !important;color:#111 !important;-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
            *,*::before,*::after{box-sizing:border-box !important}
            body{width:auto !important;min-width:0 !important;font-size:13pt !important;line-height:1.5 !important}
            .shell{width:100% !important;max-width:none !important;margin:0 auto !important;padding:4mm 5mm 5mm !important}
            .topbar{position:static !important;margin:0 !important;padding:3mm 0 5mm !important;backdrop-filter:none !important;box-shadow:none !important}
            .hero{padding:6mm 0 7mm !important}
            h1{font-size:34pt !important;line-height:1.04 !important;margin:4mm 0 3mm !important}
            .subtitle{font-size:15pt !important;line-height:1.5 !important}
            .eyebrow,.byline,.note{font-size:10.5pt !important;line-height:1.45 !important}
            .client-logo{font-size:19pt !important;letter-spacing:.22em !important}
            .client-campaign-chip{font-size:10.5pt !important}
            .brief-grid,.style-grid{grid-template-columns:1fr !important;gap:4.5mm !important}
            .card,.panel,.msg{padding:5mm !important}
            .card h2,.panel h3{font-size:12pt !important;line-height:1.3 !important}
            .card p,.card li,.panel li,.icon-item span{font-size:12.5pt !important;line-height:1.52 !important}
            .concept{font-size:22pt !important;line-height:1.15 !important}
            .pill{font-size:10.5pt !important}
            .mb-head{grid-template-columns:1fr !important;gap:2.5mm !important}
            .mb-head h2{font-size:20pt !important}
            .mb-head p{font-size:12pt !important;line-height:1.48 !important}
            .mb-grid{grid-template-columns:repeat(3,minmax(0,1fr)) !important;grid-template-rows:none !important;grid-auto-flow:row !important;grid-auto-rows:44mm !important;gap:2.5mm !important}
            .mb-grid > *,.mb-grid .a,.mb-grid .b,.mb-grid .c,.mb-grid .d,.mb-grid .e,.mb-grid .f,.mb-grid .g,.mb-grid .h,.mb-grid .i,.mb-grid .j{grid-column:auto !important;grid-row:auto !important;height:44mm !important;min-height:0 !important}
            .mb-message{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:2.5mm !important}
            .msg strong{font-size:11.5pt !important;line-height:1.35 !important}
            .products{grid-template-columns:repeat(3,minmax(0,1fr)) !important;gap:2.5mm !important}
            .palette{grid-template-columns:repeat(5,minmax(0,1fr)) !important}
            .palette-labels{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
            .room{height:52mm !important}
            .lang-toggle,.pdf-btn,.admin-btn,.admin-overlay,.admin-panel{display:none !important}
            .footer{position:static !important;margin:7mm 0 0 !important;padding:4mm 0 0 !important;box-shadow:none !important;backdrop-filter:none !important;overflow:visible !important}
            img,svg,video,canvas{max-width:100% !important;height:auto}
            .card,.panel,.msg,.product,.mb-img,.products,.style-grid{break-inside:avoid-page !important;page-break-inside:avoid !important}
          }
          </style>'''

          mobile_script = r'''<script id="zume-mobile-client-position">
          document.addEventListener('DOMContentLoaded', function () {
            var label = document.querySelector('.client-label');
            var topbar = document.querySelector('.topbar');
            if (!label || !topbar) return;
            var originalParent = label.parentNode;
            var originalNext = label.nextSibling;
            function placeClientLabel(){
              if (window.matchMedia('(max-width:820px)').matches){
                label.classList.add('zume-mobile-client-label');
                if (label.previousElementSibling !== topbar) topbar.insertAdjacentElement('afterend', label);
              } else {
                label.classList.remove('zume-mobile-client-label');
                if (label.parentNode !== originalParent) originalParent.insertBefore(label, originalNext);
              }
            }
            placeClientLabel();
            window.addEventListener('resize', placeClientLabel);
          });
          </script>'''

          external_links = r'''<script id="zume-external-links-new-tab">
          document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('a[href]').forEach(function (a) {
              try {
                var u = new URL(a.getAttribute('href'), window.location.href);
                if ((u.protocol === 'http:' || u.protocol === 'https:') && u.origin !== window.location.origin) {
                  a.setAttribute('target', '_blank');
                  a.setAttribute('rel', 'noopener noreferrer');
                }
              } catch (e) {}
            });
          });
          </script>'''

          for p in Path('_site').rglob('*.html'):
            html = p.read_text(encoding='utf-8')
            if 'id="zume-global-favicon"' not in html:
              html = html.replace('</head>', favicon + '\n</head>', 1) if '</head>' in html else favicon + '\n' + html
            if 'id="zume-global-responsive-v2"' not in html:
              html = html.replace('</head>', responsive + '\n</head>', 1) if '</head>' in html else responsive + '\n' + html
            if 'id="zume-letter-large-print-v3"' not in html:
              html = html.replace('</head>', letter_large + '\n</head>', 1) if '</head>' in html else letter_large + '\n' + html
            if 'client-label' in html and 'id="zume-mobile-client-position"' not in html:
              html = html.replace('</body>', mobile_script + '\n</body>', 1) if '</body>' in html else html + '\n' + mobile_script
            if 'id="zume-external-links-new-tab"' not in html:
              html = html.replace('</body>', external_links + '\n</body>', 1) if '</body>' in html else html + '\n' + external_links
            p.write_text(html, encoding='utf-8')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
