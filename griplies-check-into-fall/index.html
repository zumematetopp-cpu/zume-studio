<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZUME Studio — Griplies — Check Into Fall</title></head><body><script>(async()=>{const files=['part1.txt','part2.txt','part3.txt','part4.txt','part5.txt'];const parts=await Promise.all(files.map(f=>fetch(f).then(r=>r.text())));const bytes=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));const html=new TextDecoder().decode(bytes);document.open();document.write(html);document.close();})().catch(e=>document.body.innerHTML='<p>Error loading proposal.</p>');</script></body></html>
